name: Build & Release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        type: boolean
        description: 'Create GitHub Release'
        default: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.12']
      fail-fast: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        shell: python
        run: |
          import sys
          import PyInstaller.__main__
          
          platform_map = {
              'windows-latest': 'win',
              'macos-latest': 'macosx',
              'ubuntu-latest': 'linux'
          }
          platform = platform_map.get('${{ matrix.os }}', 'linux')
          
          args = [
              '--onefile',
              '--name', 'fileter',
              '--hidden-import', f'plyer.platforms.{platform}.notification',
              '--collect-all', 'plyer',
              '--collect-all', 'tqdm',
              'Main.py'
          ]
          
          PyInstaller.__main__.run(args)
      - name: Rename artifact for release
        shell: python
        run: |
          import os
          import shutil
          import sys
          
          is_windows = '${{ runner.os }}' == 'Windows'
          ext = '.exe' if is_windows else ''
          src = f'dist/fileter{ext}'
          dst = f'dist/fileter-${{ runner.os }}{ext}'
          
          if os.path.exists(src):
              shutil.move(src, dst)
              print(f'Renamed {src} -> {dst}')
          else:
              print(f'Source not found: {src}')
              sys.exit(1)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fileter-${{ runner.os }}
          path: dist/fileter-${{ runner.os }}*

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ steps.tag.outputs.tag }}
          files: artifacts/**/fileter-*
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true